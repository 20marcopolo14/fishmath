<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Message</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

    :root {
      --pink: #ff4fd8;
      --cyan: #54f7ff;
      --yellow: #fff36b;
      --dark: #09051b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 79, 216, .24), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(84, 247, 255, .2), transparent 30%),
        linear-gradient(135deg, #09051b, #180b32 48%, #061c2c);
      font-family: 'Orbitron', sans-serif;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      pointer-events: none;
      background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0deg 4deg, transparent 4deg 18deg);
      animation: spin 18s linear infinite;
    }

    body::after {
      animation-direction: reverse;
      animation-duration: 27s;
      opacity: .5;
    }

    .message {
      position: relative;
      z-index: 1;
      width: min(900px, 90vw);
      padding: clamp(28px, 7vw, 76px);
      text-align: center;
      border: 2px solid var(--cyan);
      background: rgba(5, 4, 23, .72);
      box-shadow: 0 0 24px var(--cyan), inset 0 0 45px rgba(255, 79, 216, .18);
      animation: float 3s ease-in-out infinite, borderPulse 1.8s ease-in-out infinite alternate;
      transform: skew(-1deg);
    }

    h1, p {
      margin: 0;
      text-transform: none;
      text-shadow: 0 0 8px currentColor, 3px 3px 0 rgba(255, 79, 216, .55);
      animation: textGlitch 1.4s steps(2, end) infinite, colorShift 5s linear infinite;
    }

    h1 {
      color: var(--yellow);
      font-size: clamp(28px, 5.4vw, 68px);
      line-height: 1.18;
      letter-spacing: .08em;
    }

    p {
      margin-top: clamp(30px, 6vw, 62px);
      color: var(--pink);
      font-size: clamp(14px, 2.3vw, 25px);
      letter-spacing: .12em;
      animation-delay: -.4s;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: skew(-1deg) translateY(0) rotate(-.4deg); } 50% { transform: skew(1deg) translateY(-12px) rotate(.4deg); } }
    @keyframes borderPulse { from { border-color: var(--cyan); box-shadow: 0 0 18px var(--cyan), inset 0 0 30px rgba(255, 79, 216, .15); } to { border-color: var(--pink); box-shadow: 0 0 38px var(--pink), inset 0 0 60px rgba(84, 247, 255, .2); } }
    @keyframes textGlitch { 0%, 88%, 100% { transform: translate(0); } 90% { transform: translate(-3px, 2px); } 93% { transform: translate(4px, -2px); } 96% { transform: translate(-2px, 1px); } }
    @keyframes colorShift { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(35deg); } }
  </style>
</head>
<body>
  <main class="message">
    <h1>Well this website doesnt work sooooooo.... i deleted it</h1>
    <p>This message was written by Daniel</p>
  </main>
</body>
</html>
